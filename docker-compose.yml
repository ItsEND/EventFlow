# Полная локальная среда EventFlow.
# Запуск: docker compose up --build
# Остановка: docker compose down
# Полное удаление локальных данных: docker compose down -v

x-jwt-environment: &jwt-environment
  Jwt__Secret: 739C49F6-4E4B-d93d8a3c-34b3-43a2-9ab7-f25ee0bc9512-49A3-977D-CB5D16C8C6F6
  Jwt__Issuer: EventFlow
  Jwt__Audience: EventFlow.Client
  Jwt__LifetimeMinutes: "60"

services:
  users-db:
    image: postgres:16-alpine
    container_name: eventflow-users-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventflow_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventflow_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16-alpine
    container_name: eventflow-events-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventflow_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventflow_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16-alpine
    container_name: eventflow-bookings-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventflow_bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventflow_bookings"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:8.3.0
    container_name: eventflow-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-api:
    build:
      context: .
      dockerfile: src/Services/Users/EventFlow.Users.Api/Dockerfile
    container_name: eventflow-users-api
    restart: unless-stopped
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UserConnection: Host=users-db;Port=5432;Database=eventflow_users;Username=postgres;Password=postgres
    ports:
      - "5056:8080"
    depends_on:
      users-db:
        condition: service_healthy

  events-api:
    build:
      context: .
      dockerfile: src/Services/Events/EventFlow.Events.Api/Dockerfile
    container_name: eventflow-events-api
    restart: unless-stopped
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventConnection: Host=events-db;Port=5432;Database=eventflow_events;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: eventflow-events
    ports:
      - "5265:8080"
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bookings-api:
    build:
      context: .
      dockerfile: src/Services/Bookings/EventFlow.Bookings.Api/Dockerfile
    container_name: eventflow-bookings-api
    restart: unless-stopped
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BookingConnection: Host=bookings-db;Port=5432;Database=eventflow_bookings;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "5176:8080"
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eventflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eventflow.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      users-db:
        condition: service_healthy
      events-db:
        condition: service_healthy
      bookings-db:
        condition: service_healthy

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
  kafka-data:
  pgadmin-data:
